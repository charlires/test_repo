# events
# pull_requests
# push
# tags
on:
  workflow_dispatch: # reusable workflow
    inputs:
      nombre:
        description: 'Nombre de usuario'
        required: true
        default: 'yuri'
        type: string
      environment:
        description: 'Ambiente de despliegue'
        required: false
        default: 'test'
        type: environment

# environment:
#   name: test
#   url: https://example.com

jobs:
  test1:
    runs-on: ubuntu-latest
    steps:
      - name: set to putput
        id: step1
        run: echo "language=go" >> $GITHUB_OUTPUT
      # - name: code checkout
      #   uses: actions/checkout@v3

      # - name: set up Go
      #   uses: actions/setup-go@v4
      #   with:
      #     go-version: '1.20'

      - name: run yuri script
        run: |
          echo ${{ vars.NOMBRE }}
          echo ${{ secrets.PASSWORD }}
          echo "Hello, ${{ inputs.nombre }}!"
    
  test2: 
    runs-on: ubuntu-latest
    needs: test1
    if : ${{ needs.test1.outputs.language == 'go' }}
    steps:
      - name: code checkout
        run: echo $LANGUAGE
        env:
          LANGUAGE: ${{ needs.test1.outputs.language }}
  
  test3:
    runs-on: ubuntu-latest
    needs: test1
    if : ${{ needs.test1.outputs.language == 'nodejs' }}
    steps:
      - name: use action
        uses: ./.github/actions/test
        with:
          name_required: "yuri"
          name_not_required: "not required"